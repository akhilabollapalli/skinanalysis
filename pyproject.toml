[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skin-analysis"
version = "0.1.0"
description = "Commercial-open RGB selfie skin analysis: classical CV, ordinal output, owned IP"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.5",
    "scikit-image>=0.21",
    "mediapipe>=0.10",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
# scripts/ live outside the package and add src/ to sys.path at runtime; mypy needs the
# same root or it cannot resolve `from skin_analysis.face import landmarks`.
mypy_path = "src"
warn_return_any = true
ignore_missing_imports = true

# Do not follow into third-party source. `python_version` above is our floor (3.10), but
# installed packages are free to use newer syntax -- scikit-image pulls in tifffile, which
# uses 3.12 `type` statements, and mypy reports that as a syntax error and then stops
# checking OUR code entirely. These libraries ship no usable annotations for our purposes
# anyway; the wrappers around them are what we typecheck.
[[tool.mypy.overrides]]
module = ["cv2.*", "mediapipe.*", "skimage.*", "tifffile.*", "scipy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
