# Feature parameters and ordinal severity thresholds.
#
# IMPORTANT: every value here is a PLACEHOLDER until calibrated against commercially
# usable annotations on a subject-level holdout (see architecture doc §13, §20 phase 2).
# Do not ship user-facing severity while `calibrated: false`.
#
# Thresholds are on the robust z-score of the concern's raw metric within its ROI:
#     z = (m - median_ref[ROI]) / (MAD_ref[ROI] + eps)
#
# No feature module may hardcode any of these. If code needs a knob, it goes here.

meta:
  calibrated: false
  calibration_source: null    # e.g. "fairface_reannotation_v1"
  calibrated_on: null
  holdout: subject_level

defaults:
  eps: 1.0e-6
  # z-score cutoffs: not_detected < t0 <= mild < t1 <= moderate < t2 <= high
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}
  # A region is reported only if it is at least this severe.
  min_reportable: mild

# ---------------------------------------------------------------- ACTIVE features

redness:
  enabled: true
  status: active
  # Computed on the COLOR-CALIBRATED copy. CIELAB a* excess vs a local robust baseline.
  # Known limitation: without hemoglobin decomposition this partially measures lighting.
  baseline:
    window_px: 129           # local baseline window; must exceed lesion scale
    use_roi_median: true
  metric:
    channel: a_star
    percentile_for_intensity: 95
    min_component_px: 40     # reject speckle
  asymmetry:
    enabled: true
    # Left/right difference is reported only when capture QC shadow asymmetry passed,
    # otherwise it is lighting, not skin.
    require_qc_shadow_pass: true
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

pigmentation:
  enabled: true
  status: active
  # CIELAB L* local deficit on the COLOR-CALIBRATED copy.
  baseline:
    window_px: 151
    use_roi_median: true
  metric:
    channel: l_star
    direction: deficit
    min_component_px: 25
    max_component_px: 6000   # larger regions are shading, not spots
    # Reject candidates whose boundary gradient matches a shadow edge profile.
    shadow_rejection: true
    shadow_gradient_ratio: 0.35
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

texture:
  enabled: true
  status: active
  # Classical descriptors on the STRUCTURAL copy, per ROI patch.
  patch:
    size_px: 128
    stride_px: 64
    min_valid_frac: 0.75
  glcm:
    distances: [1, 2, 4]
    angles_deg: [0, 45, 90, 135]
    levels: 64
    features: [contrast, homogeneity, energy, entropy]
  frequency:
    hf_band_lo: 0.25         # normalized frequency; tied to capture pixel density
    hf_band_hi: 0.80
  aggregate: robust_mean     # across patches within an ROI
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

wrinkles:
  enabled: true
  status: active_baseline
  # Multi-scale Gabor + Hessian ridge filtering on the STRUCTURAL copy.
  # Baseline only: responds to hair, glasses frames, and shadow edges as well as lines,
  # so suppression below is part of the algorithm, not an optional extra.
  gabor:
    sigmas: [1.5, 2.5, 4.0]
    orientations: 8
    lambda_px: [4, 8, 16]
  hessian:
    scales: [1.0, 2.0, 3.0]
    ridge_response: frangi
  morphology:
    min_line_length_px: 25
    max_line_width_px: 12
    close_kernel_px: 3
  suppression:
    hair: true
    glasses: true
    roi_edge_margin_px: 8    # ignore responses hugging the ROI boundary
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

# ------------------------------------- EXPERIMENTAL — disabled pending clear labels
# Do not set enabled: true to fill the UI. Each requires commercially clear labels
# AND a passed acceptance gate (architecture doc §20 phases 5-7).

fine_lines:
  enabled: false
  status: experimental
  blocked_on: validated_high_resolution_commercial_labels
  # Derived from the wrinkle line map; geometry computed internally only.
  geometry:
    width_percentile: 50
    min_continuity: 0.6
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

acne:
  enabled: false
  status: experimental
  blocked_on: commercial_open_lesion_level_labels
  # Interface preserved so enabling later changes no app-facing code.
  detector:
    backend: null
    min_lesion_px: 12
    nms_iou: 0.4
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

pores:
  enabled: false
  status: experimental
  blocked_on: commercial_open_native_resolution_pore_masks
  tiling:
    tile_px: 256
    stride_px: 192
    require_native_resolution: true
  candidates:
    method: hessian_log
    min_px: 3
    max_px: 60
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}
