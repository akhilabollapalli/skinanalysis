# Feature parameters, reference standardization, and ordinal severity thresholds.
#
# IMPORTANT: every threshold here is a PLACEHOLDER until calibrated against commercially
# usable annotations on a subject-level holdout (architecture doc §13, §20 phase 2).
# While `meta.calibrated` is false, `ScanResultInternal.to_public()` raises
# CalibrationRequiredError and the product has no user-facing output at all (D2).
#
# TWO NORMALIZATIONS, DELIBERATELY NAMED DIFFERENTLY (D1). Do not conflate them:
#
#   z_local  within-image, in features/*.py       "does this area differ from nearby skin?"
#            z_local(x) = (f(x) - median(f(N_x))) / (1.4826*MAD(f(N_x)) + eps)
#            NOT a severity score. A uniformly red face has weak local contrast.
#
#   z_ref    population, in decision/standardize.py       feature standardization
#            z_ref = (m - Median_ref[ROI]) / (1.4826*MAD_ref[ROI] + eps)
#            `ref` = a frozen, commercially cleared calibration cohort captured under the
#            V1 acquisition protocol. NOT "people demographically like this user", and it
#            does not define what normal or healthy skin is.
#
# No feature module may hardcode any value here. If code needs a knob, it goes here.

meta:
  calibrated: false
  calibration_source: null    # e.g. "fairface_reannotation_v1"
  calibrated_on: null
  holdout: subject_level
  protocol_version: v1

# ---------------------------------------------------------------- reference statistics
# D1 stage B. Populated by a calibration run, never by hand. Each leaf file carries its
# own `calibrated` flag; a concern is publishable only when every primary ROI it needs
# has a calibrated reference file AND meta.calibrated is true.
reference_stats:
  root: data/reference/v1
  layout: "{root}/{concern}.json"   # median/mad keyed roi -> measurement
  manifest: "{root}/manifest.json"
  capture_profile: default
  mad_scale: 1.4826           # consistent with z_local; makes MAD a sigma estimate
  eps: 1.0e-6
  # Floor on cohort size. A median and MAD from two or three people look entirely
  # normal and mean nothing; the manifest may raise this but never lower it.
  min_cohort_subjects: 200
  # Reference sets are IMMUTABLE once frozen. A new protocol gets data/reference/v2/;
  # a production reference is never edited in place, so old scans stay reproducible.
  immutable_once_frozen: true

# ---------------------------------------------------------------- capture scale anchor
# D1: fixed pixel windows are retired. `129 px` does not mean the same thing at two
# resolutions, so cohort statistics computed with one would not transfer between devices.
# Every local window is a fraction of inter-ocular distance, resolved to an odd pixel
# count at runtime.
scale:
  anchor: inter_ocular_distance
  min_anchor_px: 90           # below this the capture cannot support local windows at all

# ---------------------------------------------------------------- the three image copies
# D5. They deliberately do NOT share preprocessing. Every knob here is fixed, i.e. it does
# not depend on image content: an adaptive step upstream of a measurement means the
# measurement partly reports the adaptation.
image_copies:
  color:
    # sRGB -> Lab/D65 and nothing else (D4). These flags exist so that turning one on is a
    # visible config change with a review attached, not an inline edit in a feature module.
    gray_world: false
    illuminant_estimation: false
    clahe: false
  texture:
    # Luminance from L*, fixed linear rescale. CLAHE is local adaptive gain, so a GLCM
    # computed downstream of it partly measures CLAHE's response to the neighbourhood
    # instead of the skin.
    clahe: false
    normalization: fixed
  ridge:
    # The only branch where enhancement is even permitted, and only after validation.
    # Adopting one refreezes calibration, because the ridge response distribution moves.
    enhancement: none         # none | (a validated method name)
    clahe: false

defaults:
  eps: 1.0e-6
  # Pixel floor for a per-ROI robust statistic, in anchor^2 (D1). Below this a median and
  # a MAD are computed from too few pixels to mean anything, and the honest answer is
  # UNMEASURABLE rather than a number that looks like every other number.
  min_support_frac_of_iod2: 0.004
  # z_ref cutoffs: not_detected < t0 <= mild < t1 <= moderate < t2 <= high
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}
  # A region is reported only if it is at least this severe.
  min_reportable: mild
  # D6 default aggregation. Concerns override `strong_single_roi` below.
  aggregation:
    method: max_with_support
    min_rois_at_max: 2
    demote_bands: 1

# ---------------------------------------------------------------- ACTIVE features

redness:
  enabled: true
  status: active
  # Runs on the STANDARDIZED COLOR-ANALYSIS COPY (D4 -- the term "color-calibrated" is
  # retired; without a chart or RAW reference it overclaims). sRGB -> Lab/D65, no
  # gray-world, no illuminant estimation. Illumination is handled by the local baseline.
  # Known limitation: without hemoglobin decomposition this partially measures lighting.
  image_copy: color
  # Nasolabial excluded from redness severity (D8): the fold's cast shadow is too
  # ambiguous against genuine erythema at V1 fidelity.
  primary_rois: [forehead, left_cheek, right_cheek, nose, chin]
  local:                       # D1 stage A
    window_frac_of_iod: 0.50   # must exceed lesion scale
    use_roi_median: true
  metric:
    channel: a_star
    # Names the `p90_delta_a` raw measurement, so it is 90 and not 95. A config value that
    # disagrees with the measurement name it produces is a bug waiting to be inherited by
    # a cohort statistic.
    percentile_for_intensity: 90
    # z_local cutoff above which a pixel counts as affected (D1 stage A). PLACEHOLDER:
    # this is a within-image contrast, not a severity, and it moves at calibration.
    z_local_threshold: 1.5
    # Component areas are fractions of anchor^2 (D1): a 40-px blob is a lesion at one
    # resolution and sensor noise at another.
    min_component_area_frac_of_iod2: 0.0007    # reject speckle
  # Raw measurements handed to decision/standardize.py (D1 stage B).
  raw_measurements: [affected_area_ratio, median_positive_delta_a, p90_delta_a]
  decision:
    # How one ROI's several z_ref values collapse to one band. Erythema is patchy, so the
    # worst standardized measurement carries the ROI.
    combine: max
    # Sign applied before combining: +1 when larger means worse. Every redness measurement
    # already increases with severity.
    direction: {affected_area_ratio: 1, median_positive_delta_a: 1, p90_delta_a: 1}
  asymmetry:
    enabled: true
    # Left/right difference is reported only when capture QC shadow asymmetry passed,
    # otherwise it is lighting, not skin. Nasolabial never participates (D8).
    require_qc_shadow_pass: true
    excluded_rois: [left_nasolabial, right_nasolabial]
  aggregation:
    method: max_with_support
    min_rois_at_max: 2
    demote_bands: 1
    # D6 escape hatch: one ROI may carry the level alone if the evidence is strong.
    strong_single_roi:
      min_affected_area_ratio: 0.18
      min_p90_delta_a: 6.0
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

pigmentation:
  enabled: true
  status: active
  image_copy: color
  primary_rois: [forehead, left_cheek, right_cheek, nose, chin]   # nasolabial excluded (D8)
  local:
    window_frac_of_iod: 0.60
    use_roi_median: true
  metric:
    channel: l_star
    direction: deficit
    z_local_threshold: 1.5                     # PLACEHOLDER, moves at calibration
    min_component_area_frac_of_iod2: 0.0004
    max_component_area_frac_of_iod2: 0.10      # larger regions are shading, not spots
    # Reject candidates whose boundary gradient matches a shadow edge profile.
    shadow_rejection: true
    # A pigmented spot has a SHARP boundary; a cast shadow ramps, because it is a penumbra.
    # The discriminant is the observed boundary gradient divided by the gradient a STEP
    # edge of the SAME contrast would produce across `shadow_edge_width_frac_of_iod`.
    # Dividing by the component's own contrast is what stops the test from simply
    # preferring dark components; the width is a fraction of the anchor so the ratio is
    # dimensionless and scale-invariant (D1). Below this, the candidate is shading.
    shadow_gradient_ratio: 0.35
    # The distance a genuine spot's edge is expected to transition over.
    shadow_edge_width_frac_of_iod: 0.01
  raw_measurements: [spot_area_ratio, median_delta_L, spot_count]
  decision:
    combine: max
    direction: {spot_area_ratio: 1, median_delta_L: 1, spot_count: 1}
  aggregation:
    method: max_with_support
    min_rois_at_max: 2
    demote_bands: 1
    # Spots are focal and genuinely can be one-sided, so support comes from lesion
    # evidence rather than ROI count (D6).
    strong_single_roi:
      min_spot_count: 6
      min_spot_area_ratio: 0.04
      min_median_delta_L: 4.0
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

texture:
  enabled: true
  status: active
  # Runs on the TEXTURE COPY: luminance with fixed normalization only. CLAHE is local
  # adaptive gain, so GLCM downstream of it would partly measure CLAHE's response to the
  # neighborhood instead of the skin (D5).
  image_copy: texture
  clahe: false
  primary_rois: [forehead, left_cheek, right_cheek, nose]         # nasolabial excluded (D8)
  patch:
    # 0.52 was tried and is larger than a cheek. Measured on real faces, no 131px patch
    # (0.52 x an anchor of 252) was 75% analyzable skin in either cheek or the nose, so
    # texture could only ever be scored on the forehead -- and the other three ROIs
    # reported UNMEASURABLE for a reason that had nothing to do with the capture.
    #
    # A patch must fit INSIDE the narrowest primary ROI after erosion, not merely inside
    # the face. Changing this changes the GLCM statistic, so it may only move while the
    # concern is uncalibrated; afterwards it refreezes calibration.
    size_frac_of_iod: 0.26
    stride_frac_of_iod: 0.13
    min_valid_frac: 0.75
    max_patches_per_roi: 24    # D10 latency budget; sampled deterministically
  glcm:
    # Co-occurrence offsets as FRACTIONS OF THE ANCHOR, resolved to integer pixels at
    # runtime (D1). Fixed offsets of [1, 2, 4] px were the first version and are a pixel-
    # valued spatial parameter: at two capture distances the same offset spans different
    # physical skin, so a contrast computed with one does not transfer to a cohort built
    # with the other. These fractions reproduce [1, 2, 4] px at an anchor of 250.
    #
    # Rounding to integers makes the offsets lumpy at small anchors -- unavoidable, since a
    # GLCM offset has to be a whole pixel. `scale.min_anchor_px` is what keeps the capture
    # far enough from the floor for the three offsets to stay distinct.
    distances_frac_of_iod: [0.004, 0.008, 0.016]
    angles_deg: [0, 45, 90, 135]
    levels: 64
    features: [contrast, homogeneity, energy, entropy]
  frequency:
    # Band edges in CYCLES PER PATCH, not cycles per pixel.
    #
    # Cycles per pixel was tried and is scale DEPENDENT, which defeats the whole point of
    # an anchor-proportional patch: the patch covers the same fraction of the face at every
    # capture distance, so a closer capture spends more pixels on the same physical skin and
    # every physical feature slides DOWN the cycles-per-pixel axis. Measured on the same
    # synthetic skin at IOD 130 and IOD 260, hf_ratio moved 0.46 -> 0.74 -- a 60% drift that
    # would have gone straight into the cohort statistics as if it were skin.
    #
    # Cycles per patch is invariant because the patch is a fixed fraction of the anchor.
    #
    # The upper edge must stay below the Nyquist limit of the SMALLEST patch the capture
    # floor allows (min_anchor_px 90 x size_frac_of_iod 0.26 = 23 px, Nyquist 11.5), or part
    # of the band is simply unmeasurable at the low end of the supported scale range.
    hf_band_lo_cycles_per_patch: 3.0
    hf_band_hi_cycles_per_patch: 10.0
  aggregate: robust_mean       # across patches within an ROI
  # Fixed grey-level quantization for the GLCM, over the FULL luminance range rather than
  # per-patch min/max. Per-patch rescaling would be adaptive gain by the back door, which
  # is the same objection that keeps CLAHE out of this branch (D5).
  quantization:
    range: [0.0, 255.0]
  raw_measurements: [glcm_contrast, glcm_homogeneity, glcm_energy, glcm_entropy,
                     gradient_energy, local_variance, hf_ratio]
  decision:
    # Roughness is a FIELD property, so the median across measurements is the honest
    # summary; a max would let one GLCM feature's noise set the band.
    combine: median
    # Homogeneity and energy fall as texture gets rougher, so their sign is inverted
    # before combining. Without this, a rough ROI would partially cancel itself out.
    direction:
      glcm_contrast: 1
      glcm_homogeneity: -1
      glcm_energy: -1
      glcm_entropy: 1
      gradient_energy: 1
      local_variance: 1
      hf_ratio: 1
  aggregation:
    method: max_with_support
    min_rois_at_max: 2
    demote_bands: 1
    # Roughness is a field property; one rough ROI is a mask defect until proven
    # otherwise. No single-ROI escape (D6).
    strong_single_roi: null
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

wrinkles:
  enabled: true
  status: active_baseline
  # Runs on the RIDGE COPY. Multi-scale Gabor + Hessian ridge filtering.
  # Baseline only: responds to hair, glasses frames, and shadow edges as well as lines,
  # so suppression below is part of the algorithm, not an optional extra.
  image_copy: ridge
  # The only concern that may use nasolabial, because the fold IS a morphology target (D8).
  primary_rois: [forehead, left_crows_feet, right_crows_feet,
                 left_under_eye, right_under_eye, left_nasolabial, right_nasolabial]
  clahe: false                 # ablation candidate only; adopting it refreezes calibration (D5)
  # Filter scales are FRACTIONS OF THE ANCHOR, like every other spatial parameter (D1).
  #
  # `sigmas` and `scales` were originally in pixels while `lambda` was already fractional,
  # which is the worst of both: the envelope and the wavelength of the same Gabor kernel
  # scaled differently with capture distance, so the bank was not merely mis-scaled, it
  # changed SHAPE between two captures of the same face. The values below reproduce the
  # original pixel scales at an anchor of 250.
  gabor:
    sigmas_frac_of_iod: [0.006, 0.010, 0.016]
    orientations: 8
    lambda_frac_of_iod: [0.016, 0.033, 0.065]
  hessian:
    scales_frac_of_iod: [0.004, 0.008, 0.012]
    ridge_response: frangi
  # Cut on the combined ridge response, as a PERCENTILE within the ROI.
  #
  # Deliberately not a MAD-based z_local, and this is the one place in the project where
  # z_local is the wrong tool. A ridge response is one-sided and spikes at zero: on a real
  # forehead its median was 0.006 and its MAD 0.009, so z >= 1.5 selected 40% of the ROI
  # and the "lines" were blobs. A MAD estimated on a spike-at-zero distribution does not
  # describe its spread, so a z threshold on it has no stable meaning.
  #
  # PLACEHOLDER: this fixes what fraction of each ROI enters the geometry filter, and the
  # geometry filter -- not this number -- does the actual discrimination. Calibrate it
  # against real captures, not against generative images (SFHQ is infrastructure only).
  ridge_percentile_cut: 96.0
  morphology:
    min_line_length_frac_of_iod: 0.10
    max_line_width_frac_of_iod: 0.05
    close_kernel_frac_of_iod: 0.012
  suppression:
    hair: true
    glasses: true
    roi_edge_margin_frac_of_iod: 0.033   # ignore responses hugging the ROI boundary
  raw_measurements: [line_density, line_length, ridge_contrast]
  decision:
    # Lines are focal: one deeply creased band is the finding, so the worst standardized
    # measurement carries the ROI.
    combine: max
    direction: {line_density: 1, line_length: 1, ridge_contrast: 1}
  aggregation:
    method: max_with_support
    min_rois_at_max: 2
    demote_bands: 1
    # Forehead-only or crow's-feet-only wrinkling is normal anatomy, not an artifact (D6).
    strong_single_roi:
      min_line_density: 0.035
      min_line_length: 0.22
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

# ------------------------------------- EXPERIMENTAL — disabled pending clear labels
# Do not set enabled: true to fill the UI. Each requires commercially clear labels
# AND a passed acceptance gate (architecture doc §20 phases 5-7).

fine_lines:
  enabled: false
  status: experimental
  blocked_on: validated_high_resolution_commercial_labels
  image_copy: ridge
  primary_rois: [left_crows_feet, right_crows_feet, left_under_eye, right_under_eye]
  # Derived from the wrinkle line map; geometry computed internally only.
  geometry:
    width_percentile: 50
    min_continuity: 0.6
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

acne:
  enabled: false
  status: experimental
  blocked_on: commercial_open_lesion_level_labels
  image_copy: color
  primary_rois: [forehead, left_cheek, right_cheek, nose, chin]
  # Interface preserved so enabling later changes no app-facing code.
  detector:
    backend: null
    min_lesion_px: 12
    nms_iou: 0.4
  aggregation:
    method: max_with_support
    min_rois_at_max: 2
    demote_bands: 1
    strong_single_roi:
      min_lesion_burden: null      # calibrate before enabling
      min_affected_area_ratio: null
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}

pores:
  enabled: false
  status: experimental
  blocked_on: commercial_open_native_resolution_pore_masks
  image_copy: texture
  primary_rois: [nose, left_cheek, right_cheek, forehead]
  tiling:
    tile_px: 256
    stride_px: 192
    require_native_resolution: true   # never resize the face before pore analysis
  candidates:
    method: hessian_log
    min_px: 3
    max_px: 60
  thresholds: {t0: 0.5, t1: 1.5, t2: 2.5}
