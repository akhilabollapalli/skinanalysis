# Capture quality gate thresholds.
#
# The gate fails closed: any failure returns RETAKE and no concern logic runs.
# These values are the product's main defense against the known weakness of V1's
# classical CIELAB proxies, which partially measure the room's lighting rather than
# the skin. Tighten these before loosening any feature threshold.
#
# D4 raised the stakes here: V1 performs NO white-balance correction, so
# `white_balance.max_gray_world_deviation` is now the only thing standing between a
# colour-cast capture and a redness/pigmentation measurement. It is load-bearing.
#
# D11 structure: thresholds are keyed by capture profile. Every metric that would
# otherwise be resolution-dependent is computed on the CANONICAL QC FACE CROP
# (`qc_face_width_px`), not the raw upload, so one `default` profile is comparable
# across devices. Add an override only when validation demonstrates a systematic
# device bias -- do not invent a phone cohort.

meta:
  schema_version: 2
  active_profile: default

capture_profiles:

  default:

    # ------------------------------------------------------------ canonical crop
    # D11: normalise scale BEFORE measuring, instead of parameterising per device.
    # The face box is resampled to this width and every scale-sensitive metric below
    # (blur, specular, texture-adjacent checks) is computed on that crop.
    canonical:
      qc_face_width_px: 768
      interpolation: area          # deterministic; no generative upsampling (CLAUDE.md §6)

    face:
      # Minimum face bounding-box height as a fraction of image height.
      # Below this there are not enough skin pixels for texture/wrinkle work.
      min_face_height_frac: 0.35
      # Minimum NATIVE pixels across the face box, checked before canonical resampling.
      # Downsampling to the canonical crop is legitimate; upsampling to reach it is not,
      # because measurements must trace back to real sensor pixels.
      #
      # MUST BE >= canonical.qc_face_width_px, and it is enforced in code. It was 480
      # against a canonical width of 768, which meant a face between the two passed the
      # size gate, then could not be resampled UP to canonical -- so its blur was measured
      # on a 617px crop against a threshold calibrated for 768px, and the whole point of
      # D11 (normalise scale BEFORE measuring) quietly did not happen for that capture.
      # Caught on a real 2316x3088 original whose subject simply stood further away.
      min_face_px: 768
      max_faces: 1

    pose:
      # Absolute head rotation limits in degrees. Beyond these, ROI polygons stop
      # corresponding to the same anatomy across scans, which destroys repeatability.
      max_yaw_deg: 15.0
      max_pitch_deg: 15.0
      max_roll_deg: 10.0

    blur:
      # Computed on the canonical crop, so this number is device-comparable.
      min_laplacian_var: 120.0
      # Tenengrad/Sobel energy as a secondary check, computed as mean(gx^2 + gy^2) on the
      # canonical crop.
      #
      # MEASURED AND CURRENTLY DEAD: over the 48-image corpus the p05 was 446, so this
      # cutoff never binds and `min_laplacian_var` is the only blur signal in effect. Left
      # at 60 deliberately rather than raised to a plausible-looking number -- the value
      # that makes it a real second opinion has to come from real-device captures, because
      # a generative corpus has no lens and no defocus (see scripts/qc_report.py).
      min_tenengrad: 60.0
      # The pre-gate runs on the WHOLE FRAME, before a face box exists. It therefore needs
      # its OWN thresholds and may not reuse the two above: a frame is mostly background,
      # which is smoother than skin, so the same cutoff applied to a wider support rejects
      # good captures. (Reusing a threshold across two supports is the failure mode that
      # produced every skin-mask bug in this project -- see config/skin_mask.yaml.)
      #
      # Deliberately loose. This gate only catches a catastrophically out-of-focus frame
      # early enough to skip landmark detection and mask construction (D10). The real blur
      # decision is made on the canonical crop.
      precheck_min_laplacian_var: 15.0
      precheck_min_tenengrad: 8.0

    exposure:
      # Mean luminance (0-255) over skin pixels.
      min_mean_luma: 60.0
      max_mean_luma: 200.0
      # Fraction of skin pixels clipped at either end. Clipped pixels carry no
      # measurable chroma information.
      max_clipped_low_frac: 0.02
      max_clipped_high_frac: 0.02
      # 8-bit levels at which a pixel counts as clipped. Not 0 and 255: sensor noise and
      # JPEG ringing move a genuinely clipped pixel by a level or two.
      clip_low_level: 2.0
      clip_high_level: 253.0
      # Specular highlight coverage; high values usually mean flash or oily sheen.
      #
      # The coverage FRACTION is gated here, but it is measured by the skin mask, using that
      # subject's own skin statistics (see `specular` in config/skin_mask.yaml). There are
      # deliberately no absolute L*/chroma cutoffs in this file any more.
      #
      # There were, and they were wrong: L* > 85 AND chroma < 8, the signature of a blown
      # highlight on LIGHT skin. Measured on 26 real captures of brown skin, the brightest
      # 1% of skin pixels sat at L* 42-78 with chroma 18-43, so the check matched nothing
      # and reported zero specular coverage while shine was clearly visible. An absolute
      # cutoff on a tone-dependent quantity works on light skin and silently stops working
      # on dark skin, which is the one failure mode this project treats as disqualifying.
      max_specular_frac: 0.08

    shadow:
      # Left/right mean-luminance difference as a fraction of overall mean.
      # Side lighting is the single most common cause of false asymmetry findings.
      max_lr_luma_asymmetry: 0.12
      # Fraction of skin pixels in deep shadow, marked unmeasurable rather than analyzed.
      max_deep_shadow_frac: 0.15
      # "Deep shadow" is relative to THIS capture's own mean skin luminance, not an
      # absolute level. An absolute cutoff would fire on dark skin, which is dark but
      # evenly lit -- the silent tone-dependent failure this project keeps guarding against.
      deep_shadow_luma_frac: 0.45

    white_balance:
      # LOAD-BEARING under D4. Nothing downstream corrects a colour cast, so a capture
      # that fails here would silently contaminate every a*/L* measurement.
      max_gray_world_deviation: 0.18
      # Recorded, never applied. The illumination/colour-cast QC vector is logged for
      # validation and for a future validated colour-constancy step; it must not be
      # used to modify the skin channels (D4).
      record_illumination_vector: true

    roi_visibility:
      # Each ROI must retain this fraction of its polygon after skin masking to be scored.
      min_visible_frac: 0.60
      # ROIs that must be present for a scan to proceed at all. Per-concern primary-ROI
      # requirements live in severity_thresholds.yaml (D7).
      required:
        - forehead
        - left_cheek
        - right_cheek

    occlusion:
      # Coverage fractions above which the ROI is marked unmeasurable.
      max_hair_frac: 0.25
      max_beard_frac: 0.30
      max_glasses_frac: 0.20
      # Heuristic flag only. Do not block the scan; warn and record for validation, since
      # makeup and filters bias every classical color proxy.
      warn_on_suspected_filter: true
      # A filter smooths the FACE and leaves the background alone, so the signature is
      # facial detail well below frame detail. Comparing the two is what makes this
      # independent of overall sharpness, which the blur check already covers.
      suspected_filter_detail_ratio: 0.35

# D11: empty by design. A profile is added here only with the validation run that
# demonstrated the device bias it corrects. Until then, log device metadata and use
# `default` for everything.
overrides: {}

# Device metadata to capture on every scan so a future profile decision has evidence.
# Logged internally; never part of the public payload.
device_metadata:
  record:
    - make
    - model
    - os_version
    - capture_app_version
    - image_width
    - image_height
    - focal_length_35mm
    - iso
    - exposure_time
    - flash_fired
